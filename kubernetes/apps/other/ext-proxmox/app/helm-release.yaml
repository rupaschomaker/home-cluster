apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ext-proxmox
  namespace: external-services
spec:
  interval: 15m
  chart:
    spec:
      chart: external-service
      version: 19.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  upgrade:
    preserveValues: false
  values:
    resources:
      requests:
        cpu: 10m

    route:
      main:
        enabled: true
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
        hostnames:
          - proxmox.${DOMAIN_0}
        integrations:
          homepage:
            enabled: true
            group: Infra
            name: "Proxmox"
            description: "Virtualization Server"
            widget:
              custom:
                type: "proxmox"
                username: "${API_PROXMOX_USER}"
                password: "${API_PROXMOX}"
                node: pve
    service:
      main:
        type: ExternalIP
        enabled: true
        externalIP: 192.168.1.176
        ports:
          main:
            enabled: true
            port: 8006
            protocol: https