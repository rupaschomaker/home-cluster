apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ext-truenas
  namespace: external-services
spec:
  interval: 15m
  chart:
    spec:
      chart: external-service
      version: 19.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  upgrade:
    preserveValues: false
  values:
    resources:
      requests:
        cpu: 10m

    route:
      main:
        enabled: true
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
        hostnames:
          - truenas.${DOMAIN_0}
        integrations:
          homepage:
            enabled: true
            group: Infra
            name: "TrueNAS"
            description: "Network Attached Storage"
            widget:
              custom:
                type: "truenas"
                key: ${API_TRUENAS}
                enablePools: "true"
                version: 2
    service:
      main:
        type: ExternalIP
        enabled: true
        externalIP: 192.168.1.177
        ports:
          main:
            enabled: true
            port: 443
            protocol: https