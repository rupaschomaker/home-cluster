apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft-dynmap
  namespace: minecraft-dynmap
spec:
  interval: 15m
  upgrade:
    preserveValues: false
  chart:
    spec:
      chart: external-service
      version: 19.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  releaseName: minecraft-dynmap
  values:
    route:
      main:
        enabled: true
        parentRefs:
          - name: envoy-external
            namespace: envoy-gateway
            sectionName: https
        hostnames:
          - mc.${DOMAIN_0}
        integrations:
          homepage:
            enabled: false
    service:
      main:
        type: ExternalIP
        enabled: true
        #externalName: mc.${DOMAIN_0}
        externalIP: 192.168.1.227
        ports:
          main:
            enabled: true
            port: 25566
            protocol: http