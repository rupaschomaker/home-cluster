apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: homepage
spec:
  interval: 15m
  upgrade:
    preserveValues: false
  chart:
    spec:
      chart: homepage
      version: 15.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  releaseName: homepage
  values:
    enabled: false
    resources:
      requests:
        cpu: 10m
    TZ: America/Chicago
    route:
      main:
        enabled: true
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
        hostnames:
          - homepage.${DOMAIN_0}
        integrations:
          homepage:
            enabled: false

    addons:
      codeserver:
        enabled: true
        route:
          enabled: true
          parentRefs:
            - name: envoy-internal
              namespace: envoy-gateway
              sectionName: https
          hostnames:
            - cs-homepage.${DOMAIN_0}

    credentials:
      s3creds:
        type: s3
        url: ${VOLSYNC_S3_URL}
        bucket: ${VOLSYNC_S3_BUCKET}
        accessKey: ${VOLSYNC_S3_ACCESSKEY}
        secretKey: ${VOLSYNC_S3_SECRETKEY}
        encrKey: ${VOLSYNC_ENC_KEY}
    persistence:
      config:
        volsync:
          - name: config
            type: restic
            credentials: s3creds
            dest:
              enabled: true
            src:
              enabled: true 
    workload:
      main:
        podSpec:
          automountServiceAccountToken: true
          containers:
            main:
              env:
                HOMEPAGE_ALLOWED_HOSTS: "homepage.${DOMAIN_0}"
