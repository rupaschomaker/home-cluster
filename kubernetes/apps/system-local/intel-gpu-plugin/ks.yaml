apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: intel-gpu-plugin
  namespace: flux-system
spec:
  dependsOn:
    - name: node-feature-discovery
  interval: 1h
  retryInterval: 10m
  timeout: 10m
  path: kubernetes/apps/system-local/intel-gpu-plugin/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster

