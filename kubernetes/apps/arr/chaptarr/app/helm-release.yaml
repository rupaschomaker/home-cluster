apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: chaptarr
  namespace: chaptarr
spec:
  suspend: false
  interval: 15m
  upgrade:
    preserveValues: false
  chart:
    spec:
      chart: app-template
      version: 22.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  releaseName: chaptarr
  values:
    image:
      repository: docker.io/chaptarr/chaptarr
      pullPolicy: IfNotPresent
      tag: 0.9.1000
    resources:
      requests:
        cpu: 10m
        memory: 2Gi
      limits:
        memory: 4Gi
    route:
      main:
        enabled: true
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
        hostnames:
          - chaptarr.${DOMAIN_0}
        integrations:
          homepage:
            enabled: false
    service:
      main:
        ports:
          main:
            protocol: http
            port: 8789
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                PUID: 568
                PGID: 568
    credentials:
      s3creds:
        type: s3
        url: ${VOLSYNC_S3_URL}
        bucket: ${VOLSYNC_S3_BUCKET}
        accessKey: ${VOLSYNC_S3_ACCESSKEY}
        secretKey: ${VOLSYNC_S3_SECRETKEY}
        encrKey: ${VOLSYNC_ENC_KEY}
    persistence:
      config:
        enabled: true
        mountPath: "/config"
        volsync:
          - name: config
            type: restic
            credentials: s3creds
            dest:
              enabled: false
            src:
              enabled: true 
              trigger:
                schedule: 17 10 * * *
      mediacover:
        enabled: true
        mountPath: "/config/MediaCover"          
        volsync:
          - name: mediacover
            type: restic
            credentials: s3creds
            dest:
              enabled: false
            src:
              enabled: true 
              trigger:
                schedule: 17 15 * * *
      backups:
        enabled: true
        type: pvc
        storageClass: longhorn
        accessModes: ReadWriteOnce
        size: 1Gi
        mountPath: /config/Backups
        volsync:
          - name: backups
            type: restic
            credentials: s3creds
            dest:
              enabled: false
            copyMethod: Direct
            src:
              enabled: true
              trigger:
                schedule: 17 10 * * *
      logs:
        enabled: true
        type: pvc
        storageClass: longhorn
        accessModes: ReadWriteOnce
        size: 1Gi
        mountPath: /config/logs
        volsync:
          - name: logs
            type: restic
            credentials: s3creds
            dest:
              enabled: false
            copyMethod: Direct
            src:
              enabled: true
              trigger:
                schedule: 17 10 * * *
      media-vol:
        enabled: true
        type: nfs
        mountPath: /media
        path: /mnt/data/media
        server: nas.${DOMAIN_0}

    securityContext:
      container:
        runAsUser: 568
        runAsGroup: 568