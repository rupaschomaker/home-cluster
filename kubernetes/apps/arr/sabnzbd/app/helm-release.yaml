apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
  namespace: sabnzbd
spec:
  suspend: false
  interval: 15m
  chart:
    spec:
      chart: sabnzbd
      version: 28.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  releaseName: sabnzbd
  upgrade:
    preserveValues: false
  values:
    TZ: America/Chicago
    resources:
      requests:
        cpu: 20m
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                SABNZBD__HOST_WHITELIST_ENTRIES: "sabnzbd.${DOMAIN_0}, sabnzbd.sabnzbd.svc"
    route:
      main:
        enabled: true
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
        hostnames:
          - sabnzbd.${DOMAIN_0}
        integrations:
          homepage:
            enabled: true
            group: Arr
            widget:
              custom:
                key: ${API_SABNZBD}
    credentials:
      s3creds:
        type: s3
        url: ${VOLSYNC_S3_URL}
        bucket: ${VOLSYNC_S3_BUCKET}
        accessKey: ${VOLSYNC_S3_ACCESSKEY}
        secretKey: ${VOLSYNC_S3_SECRETKEY}
        encrKey: ${VOLSYNC_ENC_KEY}
    persistence:
      config:
        volsync:
          - name: config
            type: restic
            credentials: s3creds
            dest:
              enabled: false
            src:
              enabled: true 
              trigger:
                schedule: 30 1 * * *
      logs:
        enabled: true
        type: pvc
        storageClass: longhorn
        accessModes: ReadWriteOnce
        size: 1Gi
        mountPath: /config/logs
        volsync:
          - name: logs
            type: restic
            credentials: s3creds
            dest:
              enabled: false
            copyMethod: Direct
            src:
              enabled: false
              trigger:
                schedule: 30 1 * * *
      media-vol:
        enabled: true
        type: nfs
        mountPath: /media
        path: /mnt/data/media
        server: nas.${DOMAIN_0}
    securityContext:
      container:
        UMASK: "0000"
