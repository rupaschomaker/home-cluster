apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 15m
  upgrade:
    preserveValues: false
  chart:
    spec:
      chart: external-dns
      version: 10.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  releaseName: external-dns
  values:
    resources:
      requests:
        cpu: 5m
    externaldns:
      logLevel: "debug"
      sources:
        - "service"
        - "ingress"
      domainFilters:
        - ${DOMAIN_0}
      provider: cloudflare
    secret:
      env-secrets:
        data:
          CF_API_TOKEN: ${DOMAIN_0_CLOUDFLARE_TOKEN}
