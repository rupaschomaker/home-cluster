apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
  namespace: qbittorrent
spec:
  interval: 15m
  upgrade:
    preserveValues: false
  chart:
    spec:
      chart: qbittorrent
      version: 27.0.1
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  releaseName: qbittorrent
  values:
    mouseholeImage:
      repository: docker.io/tmmrtn/mousehole
      tag: "0.5.0@sha256:2fc02b12362581e60bfd6adba788bda9eda93f8f31ed089581eeabcee4518b0d"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 20m
    portal:
      open:
        enabled: false
    global:
      stopAll: false
    TZ: America/Chicago
    qbitportforward:
      enabled: false
    common:
      gluetunImage:
        repository: oci.trueforge.org/tccr/gluetun
        tag: "v3.40.0@sha256:a8189e29155e0f8142be1500ae068a92b189b1b25abbba036321e74d6389bf2b"
      addons:
        gluetun:
          enabled: true
          container:
            resources:
              limits:
                truechart.org/tun: 1
            env:
              FIREWALL: "on"
              FIREWALL_INPUT_PORTS: "8888,5010"
              FIREWALL_OUTBOUND_SUBNETS: ${LOCALNET}
              FIREWALL_VPN_INPUT_PORTS: "${VPN_INBOUND_PORT}"
              VPN_TYPE: wireguard
              VPN_SERVICE_PROVIDER: "custom"
              LOG_LEVEL: info
              DOT: "on"
              DOT_VERBOSITY: "1"
              PPROF_ENABLED: "off"
              PPROF_BLOCK_PROFILE_RATE: "0"
              PPROF_MUTEX_PROFILE_RATE: "0"
              WIREGUARD_ENDPOINT_IP: ${VPN_ENDPOINT_IP}
              WIREGUARD_ENDPOINT_PORT: "${VPN_ENDPOINT_PORT}"
              WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES}
              WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY}
              WIREGUARD_PUBLIC_KEY: ${WIREGUARD_PUBLIC_KEY}
              WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL: "25s"
              HTTPPROXY: "on"
              HTTPPROXY_LISTENING_ADDRESS: ":8888"
              HTTPPROXY_USER: ""
              HTTPPROXY_PASSWORD: ""
              HTTPPROXY_STEALTH: "on"
              HTTPPROXY_LOG: "off"
    workload:
      main:
        podSpec:
          containers:
            mousehole:
              enabled: true
              imageSelector: mouseholeImage
              command:
                - /bin/sh
                - -c
                - |
                  until curl -fsS --max-time 2 http://127.0.0.1:9999/ >/dev/null; do
                    sleep 5
                  done
                  exec bun run src/index.ts
              env:
                MOUSEHOLE_INSECURE_ALLOW_NO_AUTH: "true"
                MOUSEHOLE_ALLOWED_HOSTS: "mousehole.${DOMAIN_0},localhost,127.0.0.1"
                MOUSEHOLE_ALLOWED_ORIGINS: "https://mousehole.${DOMAIN_0}"
                MOUSEHOLE_HTTPS_ONLY_COOKIES: "true"
              probes:
                startup:
                  enabled: true
                  type: http
                  port: 5010
                  path: /health
                  httpHeaders:
                    Host: mousehole.${DOMAIN_0}
                  spec:
                    failureThreshold: 120
                    periodSeconds: 5
                readiness:
                  enabled: true
                  type: http
                  port: 5010
                  path: /health
                  httpHeaders:
                    Host: mousehole.${DOMAIN_0}
                liveness:
                  enabled: true
                  type: http
                  port: 5010
                  path: /health
                  httpHeaders:
                    Host: mousehole.${DOMAIN_0}
    service:
      mousehole:
        enabled: true
        type: ClusterIP
        ports:
          mousehole:
            enabled: true
            port: 5010
            targetPort: 5010
            protocol: http
      torrent:
        ports:
          gluetun:
            enabled: false
          torrent:
            port: "${VPN_INBOUND_PORT}"
            targetPort: "6881"
      proxy:
        enabled: true
        type: LoadBalancer
        annotations:
          external-dns.alpha.kubernetes.io/hostname: proxy.${DOMAIN_0}
          external-dns.kubernetes.io/hostname: proxy.${DOMAIN_0}
        ports:
          proxy:
            enabled: true
            port: "8888"
            targetPort: "8888"
            protocol: http
    ingress:
      mousehole:
        enabled: true
        ingressClassName: internal
        targetSelector:
          mousehole: mousehole
        hosts:
          - host: mousehole.${DOMAIN_0}
        integrations:
          certManager:
            enabled: true
            certificateIssuer: ${CERT_ISSUER}
          nginx:
            enabled: true
      main:
        enabled: true
        ingressClassName: internal
        hosts:
          - host: qb.${DOMAIN_0}
          - host: qbittorrent.${DOMAIN_0}
        integrations:
          certManager:
            enabled: true
            certificateIssuer: ${CERT_ISSUER}
          nginx:
            enabled: true
          homepage:
            enabled: true
            group: Arr
    credentials:
      s3creds:
        type: s3
        url: ${VOLSYNC_S3_URL}
        bucket: ${VOLSYNC_S3_BUCKET}
        accessKey: ${VOLSYNC_S3_ACCESSKEY}
        secretKey: ${VOLSYNC_S3_SECRETKEY}
        encrKey: ${VOLSYNC_ENC_KEY}
    persistence:
      mousehole:
        enabled: true
        type: pvc
        storageClass: longhorn
        accessModes: ReadWriteOnce
        size: 1Gi
        mountPath: /var/lib/mousehole
        targetSelector:
          main:
            mousehole: {}
        volsync:
          - name: mousehole
            type: restic
            credentials: s3creds
            dest:
              enabled: true
            src:
              enabled: true
              trigger:
                schedule: 30 0 * * *
      config:
        volsync:
          - name: config
            type: restic
            credentials: s3creds
            dest:
              enabled: true
            src:
              enabled: true 
              trigger:
                schedule: 30 0 * * *
      vuetorrent:
        enabled: true
        mountPath: /config/vuetorrent
        volsync:
          - name: vuetorrent
            type: restic
            credentials: s3creds
            dest:
              enabled: true
            src:
              enabled: true 
              trigger:
                schedule: 30 0 * * *
      media-vol:
        enabled: true
        type: nfs
        mountPath: /media
        path: /mnt/data/media
        server: nas.${DOMAIN_0}
    securityContext:
      container:
        UMASK: "0000"
