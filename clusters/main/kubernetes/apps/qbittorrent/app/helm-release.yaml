apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
  namespace: qbittorrent
spec:
  interval: 15m
  upgrade:
    preserveValues: false
  chart:
    spec:
      chart: qbittorrent
      version: 27.0.1
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  releaseName: qbittorrent
  values:
    resources:
      requests:
        cpu: 20m
    portal:
      open:
        enabled: false
    global:
      stopAll: false
    TZ: America/Chicago
    qbitportforward:
      enabled: true
    common:
      gluetunImage:
        repository: oci.trueforge.org/tccr/gluetun
        tag: "v3.40.0@sha256:a8189e29155e0f8142be1500ae068a92b189b1b25abbba036321e74d6389bf2b"
      addons:
        gluetun:
          enabled: true
          container:
            resources:
              limits:
                truechart.org/tun: 1
            env:
              FIREWALL: "on"
              FIREWALL_INPUT_PORTS: "8000,10095"
              FIREWALL_OUTBOUND_SUBNETS: ${LOCALNET}
              FIREWALL_VPN_INPUT_PORTS: "${VPN_INBOUND_PORT}"
              VPN_TYPE: wireguard
              VPN_SERVICE_PROVIDER: "custom"
              DOT: "on"
              DOT_VERBOSITY: "1"
              PPROF_ENABLED: "off"
              PPROF_BLOCK_PROFILE_RATE: "0"
              PPROF_MUTEX_PROFILE_RATE: "0"
              WIREGUARD_ENDPOINT_IP: ${VPN_ENDPOINT_IP}
              WIREGUARD_ENDPOINT_PORT: "${VPN_ENDPOINT_PORT}"
              WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES}
              WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY}
              WIREGUARD_PUBLIC_KEY: ${WIREGUARD_PUBLIC_KEY}
              WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL: "25s"
              HTTPPROXY: "on"
              HTTPPROXY_LISTENING_ADDRESS: ":8888"
              HTTPPROXY_USER: ${HTTPPROXY_USER}
              HTTPPROXY_PASSWORD: ${HTTPPROXY_PASSWORD}
              HTTPPROXY_STEALTH: "on"
              HTTPPROXY_LOG: "on"
    secret:
      gluetun-auth:
        enabled: true
        data:
          GTN_USERNAME: user
          GTN_PASSWORD: pass
          config.toml: |
            [[roles]]
            name = "qbitportforward"
            routes = ["GET /v1/openvpn/portforwarded"]
            auth = "basic"
            username = "user"
            password = "pass"
    configmap:
      qbitportforward-script:
        enabled: true
        data:
          main.sh: |
            #!/bin/sh
            set -e

            qbt_username="$QBT_USERNAME"
            qbt_password="$QBT_PASSWORD"
            qbt_addr="$QBT_ADDR"
            gtn_addr="$GTN_ADDR"

            port_number=$(curl --fail --silent --show-error --user "$GTN_USERNAME:$GTN_PASSWORD" "$gtn_addr/v1/openvpn/portforwarded" | jq '.port')

            if [ ! "$port_number" ] || [ "$port_number" = "0" ]; then
                echo "Could not get current forwarded port from gluetun, exiting..."
                exit 1
            fi

            curl --fail --silent --show-error --cookie-jar /tmp/cookies.txt --cookie /tmp/cookies.txt \
              --header "Referer: $qbt_addr" --data "username=$qbt_username" \
              --data "password=$qbt_password" "$qbt_addr/api/v2/auth/login" >/dev/null

            listen_port=$(curl --fail --silent --show-error --cookie-jar /tmp/cookies.txt \
              --cookie /tmp/cookies.txt "$qbt_addr/api/v2/app/preferences" | jq '.listen_port')

            if [ "$port_number" = "$listen_port" ]; then
                echo "Port already set, exiting..."
                exit 0
            fi

            echo "Updating port to $port_number"
            curl --fail --silent --show-error --cookie-jar /tmp/cookies.txt --cookie /tmp/cookies.txt \
              --data-urlencode "json={\"listen_port\": $port_number}" \
              "$qbt_addr/api/v2/app/setPreferences" >/dev/null
            echo "Successfully updated port"
    workload:
      qbitportforward:
        podSpec:
          containers:
            qbitportforward:
              env:
                GTN_USERNAME:
                  secretKeyRef:
                    name: gluetun-auth
                    key: GTN_USERNAME
                GTN_PASSWORD:
                  secretKeyRef:
                    name: gluetun-auth
                    key: GTN_PASSWORD
              command: /bin/sh
              args:
                - /shared/qbitportforward-script/main.sh
    service:
      torrent:
        ports:
          gluetun:
            enabled: false
          torrent:
            port: "${VPN_INBOUND_PORT}"
            targetPort: "6881"
      proxy:
        enabled: true
        type: LoadBalancer
        annotations:
          external-dns.alpha.kubernetes.io/hostname: proxy.${DOMAIN_0}
        ports:
          proxy:
            enabled: true
            port: "8888"
            targetPort: "8888"
            protocol: http
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        hosts:
          - host: qb.${DOMAIN_0}
          - host: qbittorrent.${DOMAIN_0}
        integrations:
          certManager:
            enabled: true
            certificateIssuer: ${CERT_ISSUER}
          nginx:
            enabled: true
          homepage:
            enabled: true
            group: Arr
    credentials:
      s3creds:
        type: s3
        url: ${VOLSYNC_S3_URL}
        bucket: ${VOLSYNC_S3_BUCKET}
        accessKey: ${VOLSYNC_S3_ACCESSKEY}
        secretKey: ${VOLSYNC_S3_SECRETKEY}
        encrKey: ${VOLSYNC_ENC_KEY}
    persistence:
      gluetun-auth:
        enabled: true
        type: secret
        objectName: gluetun-auth
        mountPath: /gluetun/auth
        targetSelectAll: false
        targetSelector:
          main:
            gluetun: {}
      qbitportforward-script:
        enabled: true
        type: configmap
        objectName: qbitportforward-script
        mountPath: /shared/qbitportforward-script
        targetSelectAll: false
        targetSelector:
          qbitportforward:
            qbitportforward: {}
      config:
        volsync:
          - name: config
            type: restic
            credentials: s3creds
            dest:
              enabled: true
            src:
              enabled: true 
              trigger:
                schedule: 30 0 * * *
      vuetorrent:
        enabled: true
        mountPath: /config/vuetorrent
        volsync:
          - name: vuetorrent
            type: restic
            credentials: s3creds
            dest:
              enabled: true
            src:
              enabled: true 
              trigger:
                schedule: 30 0 * * *
      media-vol:
        enabled: true
        type: nfs
        mountPath: /media
        path: /mnt/data/media
        server: nas.${DOMAIN_0}
    securityContext:
      container:
        UMASK: "0000"
