apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: chaptarr
  namespace: chaptarr
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 18.23.3
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  releaseName: chaptarr
  values:
    image:
      repository: docker.io/chaptarr/chaptarr
      pullPolicy: IfNotPresent
      tag: 0.9.965
    resources:
      requests:
        cpu: 10m
        memory: 512M
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        hosts:
          - host: chaptarr.${DOMAIN_0}
        integrations:
          traefik:
            enabled: false
          certManager:
            enabled: true
            certificateIssuer: ${CERT_ISSUER}
    service:
      main:
        ports:
          main:
            protocol: http
            port: 8789
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                PUID: 568
                PGID: 568
    credentials:
      s3creds:
        type: s3
        url: ${VOLSYNC_S3_URL}
        bucket: ${VOLSYNC_S3_BUCKET}
        accessKey: ${VOLSYNC_S3_ACCESSKEY}
        secretKey: ${VOLSYNC_S3_SECRETKEY}
        encrKey: ${VOLSYNC_ENC_KEY}
    persistence:
      config:
        enabled: true
        mountPath: "/config"
        volsync:
          - name: config
            type: restic
            credentials: s3creds
            dest:
              enabled: true
            src:
              enabled: true 
              trigger:
                schedule: 17 10 * * *
      mediacover:
        enabled: true
        mountPath: "/config/mediacover"          
        volsync:
          - name: mediacover
            type: restic
            credentials: s3creds
            dest:
              enabled: true
            src:
              enabled: true 
              trigger:
                schedule: 17 15 * * *
      media-vol:
        enabled: true
        type: nfs
        mountPath: /media
        path: /mnt/data/media
        server: nas.${DOMAIN_0}

    securityContext:
      container:
        runAsUser: 568
        runAsGroup: 568