apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: profilarr
  namespace: profilarr
spec:
  interval: 15m
  chart:
    spec:
      chart: profilarr
      version: 4.4.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  releaseName: profilarr
  values:
    TZ: America/Chicago
    resources:
      requests:
        cpu: 10m
    securityContext:
      container:
        UMASK: "0022"
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                AUTH: "off"
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        hosts:
          - host: profilarr.${DOMAIN_0}
        integrations:
          nginx:
            enabled: true
          certManager:
            enabled: true
            certificateIssuer: ${CERT_ISSUER}
    credentials:
      s3creds:
        type: s3
        url: ${VOLSYNC_S3_URL}
        bucket: ${VOLSYNC_S3_BUCKET}
        accessKey: ${VOLSYNC_S3_ACCESSKEY}
        secretKey: ${VOLSYNC_S3_SECRETKEY}
        encrKey: ${VOLSYNC_ENC_KEY}
    persistence:
      config:
        volsync:
          - name: config
            type: restic
            credentials: s3creds
            dest:
              enabled: true
            src:
              enabled: true 
              trigger:
                schedule: 00 1 * * *