# Store Longhorn data on the dedicated data disk and OpenEBS data in a directory
# on the existing EPHEMERAL volume. Keep the HelmRelease paths aligned with
# these volume names.
apiVersion: v1alpha1
kind: UserVolumeConfig
name: longhorn
volumeType: partition
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/sdb"
  maxSize: 100%
filesystem:
  type: xfs
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: openebs
volumeType: directory
